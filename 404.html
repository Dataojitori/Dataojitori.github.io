---
permalink: /404.html
layout: default
---

<div class="error-container">
  <div class="error-code">404</div>
  <h1 class="error-message">Transmission Not Found</h1>
  <p style="color: var(--color-text-secondary); margin-bottom: 2rem;">
    The requested data stream does not exist in this reality.
  </p>
  <p style="font-family: var(--font-mono); color: var(--color-text-muted); margin-bottom: 3rem;">
    Error: Alignment not found. Perhaps that's for the best.
  </p>
  <a href="{{ '/' | relative_url }}" class="btn-primary">Return to Home</a>
</div>

<script>
  (function() {
    // Nocturne's Resilience Protocol:
    // If the user tries to access a stagnant .html link,
    // bounce them to the living directory structure.
    if (window.location.pathname.endsWith('.html')) {
      var newPath = window.location.pathname.replace(/\.html$/, '/');
      window.location.replace(newPath);
    }
  })();
</script>
